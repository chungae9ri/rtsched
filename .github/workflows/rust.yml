name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_TARGET: thumbv8m.main-none-eabihf

jobs:
  cortex-m-targets:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - thumbv7m-none-eabi
          - thumbv7em-none-eabi
          - thumbv7em-none-eabihf
          - thumbv8m.main-none-eabi
          - thumbv8m.main-none-eabihf
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust target
      run: rustup target add ${{ matrix.target }}
    - name: Build scheduler
      run: cargo build --lib --target ${{ matrix.target }}
    - name: Build scheduler with timing diagnostics
      run: cargo build --lib --features sched-isr-timing --target ${{ matrix.target }}

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Rust target
      run: rustup target add ${{ env.CARGO_BUILD_TARGET }}
    - name: Build
      run: cargo build --verbose --target ${{ env.CARGO_BUILD_TARGET }}
    - name: Create example linker memory map
      run: |
        cat > memory.x <<'EOF'
        MEMORY
        {
          FLASH (rx) : ORIGIN = 0x00000000, LENGTH = 1024K
          RAM (xrw)  : ORIGIN = 0x20000000, LENGTH = 512K
        }
        EOF
    - name: Build examples
      env:
        RUSTFLAGS: -L . -C link-arg=-Tlink.x
      run: cargo build --examples --features embedded-examples --target ${{ env.CARGO_BUILD_TARGET }}
    - name: Run tests
      run: cargo test --manifest-path Cargo.toml --features host --target x86_64-unknown-linux-gnu
    - name: Run thread and timer regressions in release mode
      run: cargo test --release --features host,sched-isr-timing --target x86_64-unknown-linux-gnu --test test_thread --test test_ktimer
